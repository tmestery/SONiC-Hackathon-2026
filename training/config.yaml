# Local base model for SFT (Hugging Face id or filesystem path).
# Mac laptop default: 0.8B (~2GB weights, ~3GB LoRA). For 9B matching Ollama
# qwen3.5:9b use "Qwen/Qwen3.5-9B" (~18GB download, ~22GB unified memory).
model:
  name_or_path: "Qwen/Qwen3.5-0.8B"
  trust_remote_code: true
  # float16 is more widely supported on Apple MPS than bfloat16
  torch_dtype: "float16"

# Optional local predict server (eval-compatible smoke).
agent:
  url: "http://127.0.0.1:8000/predict"
  timeout_s: 120
  headers: {}

data:
  splits_file: data/splits.json
  split: train
  limit: null
  prepared_dir: training/data
  system_prompt: |
    You are a SONiC failure diagnosis assistant. Given an issue title and failure
    report, explain the root cause and how to fix it in the style of a resolving
    pull-request description (Why I did it / How I did it).

training:
  output_dir: training/output
  # Keep short for laptop smoke runs; raise for real training.
  max_seq_length: 1024
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  logging_steps: 1
  save_steps: 50
  seed: 42
  # bitsandbytes 4-bit needs NVIDIA CUDA — leave false on Mac.
  load_in_4bit: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
