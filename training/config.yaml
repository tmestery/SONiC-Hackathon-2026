# Local base model for SFT (Hugging Face id or filesystem path — not an Ollama tag).
# Default: Qwen3.5-2B (~2B, ungated — no HF license form). Gemma/Llama need accept+login.
# Smaller smoke: "Qwen/Qwen3.5-0.8B". Ollama twin for inference: qwen3.5:2b (if pulled).
model:
  name_or_path: "Qwen/Qwen3.5-2B"
  trust_remote_code: true
  # float16 is more widely supported on Apple MPS than bfloat16
  torch_dtype: "float16"

# Local Ollama server used for --smoke-prompt (eval-compatible).
ollama:
  host: "http://127.0.0.1:11434"
  model: "qwen3.5:2b"
  timeout_s: 300

# BM25 over data/rag (SONiC docs). Same retrieval is used at eval time.
rag:
  enabled: true
  rag_dir: data/rag
  top_k: 3
  max_query_chars: 1500
  # Keep chunks modest so title+failure+docs fit training.max_seq_length.
  max_chars_per_chunk: 600

data:
  splits_file: data/splits.json
  split: train
  limit: null
  # Default: training/runs/<model>-lora/data/ (see training.runs_dir)
  prepared_dir: null
  system_prompt: |
    You are a SONiC failure diagnosis assistant. Given an issue title, failure
    report, and retrieved SONiC documentation, explain the root cause and how to
    fix it in the style of a resolving pull-request description
    (Why I did it / How I did it). Use the docs when relevant; do not invent APIs.

training:
  runs_dir: training/runs
  run_name: null
  # output_dir: null  # optional legacy single-folder override
  # Keep short for laptop smoke runs; raise for real training.
  max_seq_length: 1024
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  logging_steps: 1
  save_steps: 50
  seed: 42
  # bitsandbytes 4-bit needs NVIDIA CUDA — leave false on Mac.
  load_in_4bit: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
