agent:
  url: "http://127.0.0.1:8000/predict"
  timeout_s: 120
  headers: {}

# Same BM25 docs retrieval as training/ (parity with SFT user turns).
rag:
  enabled: true
  rag_dir: data/rag
  top_k: 3
  max_query_chars: 1500
  max_chars_per_chunk: 600

judges:
  - name: root_cause
    model: llama-3.3-70b-versatile
    prompt: |
      Score how well the PREDICTION identifies the same root cause as the GOLD
      explanation for this SONiC failure. Focus on causal diagnosis, not wording.
      Reply with only a number from 0 to 1.
      Title: {title}
      PREDICTION: {prediction}
      GOLD: {gold}

  - name: fix_approach
    model: llama-3.3-70b-versatile
    prompt: |
      Score how well the PREDICTION describes a fix approach that matches the GOLD
      resolution for this SONiC failure. Focus on what should change and where.
      Reply with only a number from 0 to 1.
      Title: {title}
      PREDICTION: {prediction}
      GOLD: {gold}

  - name: diagnostic_fidelity
    model: llama-3.3-70b-versatile
    prompt: |
      Score how faithfully the PREDICTION preserves the key diagnostic evidence
      implied by the GOLD explanation (errors, components, failure mode).
      Reply with only a number from 0 to 1.
      Title: {title}
      PREDICTION: {prediction}
      GOLD: {gold}

splits_file: data/splits.json
limit: null
results_dir: evaluation/results
